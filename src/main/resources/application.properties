spring.application.name=conference-platform
# Server Port
server.port=8080

# Database Configuration (H2 File-based persistence)
spring.datasource.url=jdbc:h2:file:./data/joyevents_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Hibernate / JPA (Automatically creates & updates database tables from your Java classes)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (To inspect tables in the browser at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# File upload limits (for importing delegate CSV files)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB