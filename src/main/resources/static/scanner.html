<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Joy Events - Dedicated Counter Scanner</title>
    
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">

    <!-- HTML5-QRCode Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        /* Strict Sharp Edges (No curvy boxes) */
        * {
            border-radius: 0px !important;
            box-sizing: border-box;
        }

        :root {
            --primary-navy: #0f172a;
            --accent-blue: #0284c7;
            --accent-green: #16a34a;
            --accent-red: #dc2626;
            --bg-light: #f8fafc;
            --border-dark: #334155;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-light);
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        .scanner-header {
            background: #ffffff;
            border-bottom: 2px solid #0f172a;
            padding: 0.85rem 1.25rem;
        }

        /* Camera Viewport */
        #reader {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            border: 3px solid #0f172a;
            background: #000000;
            overflow: hidden;
        }

        /* Result Cards */
        .result-card {
            display: none;
            max-width: 480px;
            width: 100%;
            margin: 1rem auto 0 auto;
            padding: 1.5rem;
            border: 3px solid #0f172a;
            text-align: center;
        }

        .result-success {
            display: block;
            background: #f0fdf4;
            border-color: #16a34a !important;
            color: #14532d;
        }

        .result-error {
            display: block;
            background: #fef2f2;
            border-color: #dc2626 !important;
            color: #7f1d1d;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body>

    <!-- TOP HEADER -->
    <div class="scanner-header d-flex justify-content-between align-items-center">
        <div>
            <h5 class="fw-bold mb-0 text-dark"><i class="bi bi-qr-code-scan text-primary me-2"></i>COUNTER SCANNER</h5>
            <small class="text-muted fw-bold" id="confCodeDisplay">Event: Loading...</small>
        </div>
        <a href="/" class="btn btn-sm btn-outline-dark fw-bold">
            <i class="bi bi-speedometer2 me-1"></i> Dashboard
        </a>
    </div>

    <div class="container py-3 flex-grow-1 d-flex flex-column align-items-center">

        <!-- ACTIVE PRIVILEGE SESSION SELECTOR -->
        <div class="w-100 mb-3" style="max-width: 480px;">
            <label class="form-label text-dark small fw-bold">ACTIVE COUNTER SESSION:</label>
            <div class="row g-2">
                <div class="col-8">
                    <select id="privilegeSelect" class="form-select border-dark fw-bold" onchange="resetScanState()">
                        <option value="" disabled selected>Loading sessions...</option>
                    </select>
                </div>
                <div class="col-4">
                    <input type="text" id="counterStation" class="form-control border-dark fw-bold" value="Counter 1">
                </div>
            </div>
            <div id="sessionTimingHint" class="small text-muted mt-1 fw-semibold"></div>
        </div>

        <!-- CAMERA SCANNER VIEWPORT -->
        <div id="reader"></div>

        <!-- LIVE RESULT DISPLAY CARD -->
        <div id="resultCard" class="result-card shadow">
            <div id="resultIcon" class="display-4 mb-2"></div>
            <h4 id="resultTitle" class="fw-bold mb-1"></h4>
            <div id="resultDoctor" class="fs-5 fw-bold mb-1"></div>
            <div id="resultDetails" class="small mb-2 font-mono"></div>
            <div id="resultMessage" class="fw-bold small py-1 px-2 border d-inline-block"></div>
        </div>

        <!-- MANUAL ENTRY FALLBACK (IF BADGE IS SCRATCHED) -->
        <div class="w-100 mt-3 text-center" style="max-width: 480px;">
            <button class="btn btn-sm btn-outline-secondary mb-2 fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#manualEntry">
                <i class="bi bi-keyboard me-1"></i> Camera Smudged? Manual ID Entry
            </button>
            <div class="collapse" id="manualEntry">
                <div class="input-group">
                    <input type="text" id="manualInput" class="form-control border-dark font-mono text-uppercase" placeholder="e.g. PHO26-0001">
                    <button class="btn btn-dark fw-bold" onclick="handleManualSubmit()">
                        <i class="bi bi-arrow-right-circle me-1"></i> Verify
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 1. Detect Conference Code from URL (e.g. /scan/PHO26 or ?conference=PHO26)
        let pathParts = window.location.pathname.split('/');
        let detectedConf = pathParts[pathParts.length - 1];
        if (!detectedConf || detectedConf === 'scanner.html' || detectedConf === 'scan') {
            const urlParams = new URLSearchParams(window.location.search);
            detectedConf = urlParams.get('conference') || 'PHO26';
        }
        const CONFERENCE_CODE = detectedConf.toUpperCase();

        let isProcessing = false;
        let html5QrCode = null;
        let sessionsCache = [];

        // 2. Web Audio Sound Chimes
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playChime(success) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (success) {
                    // Pleasant high double chime (Approved)
                    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
                    osc.frequency.setValueAtTime(880.00, audioCtx.currentTime + 0.12); // A5
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                } else {
                    // Low buzz (Rejected / Already Claimed)
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.5);
                }
            } catch (e) {
                console.log("Audio feedback muted by browser policy", e);
            }
        }

        // 3. Load Dynamic Privilege Sessions from Backend
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('confCodeDisplay').innerText = `Event: ${CONFERENCE_CODE}`;
            loadSessions();
            startCamera();
        });

        async function loadSessions() {
            try {
                const res = await fetch(`/api/privileges?conferenceCode=${CONFERENCE_CODE}`);
                sessionsCache = await res.json();
                
                const select = document.getElementById('privilegeSelect');
                select.innerHTML = '';

                if (sessionsCache.length === 0) {
                    select.innerHTML = `<option value="">No active sessions found</option>`;
                    return;
                }

                sessionsCache.forEach((s, idx) => {
                    const opt = document.createElement('option');
                    opt.value = s.id;
                    const icon = s.privilegeType === 'KIT' ? '🎒' : s.privilegeType === 'WORKSHOP' ? '🔬' : '🍽️';
                    opt.innerText = `${icon} ${s.name} (Day ${s.dayNumber || 1})`;
                    if (idx === 0) opt.selected = true;
                    select.appendChild(opt);
                });

                updateTimingHint();
            } catch (err) {
                console.error("Could not load sessions", err);
            }
        }

        function updateTimingHint() {
            const selectedId = document.getElementById('privilegeSelect').value;
            const session = sessionsCache.find(s => s.id == selectedId);
            const hint = document.getElementById('sessionTimingHint');
            if (session) {
                const start = new Date(session.startTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const end = new Date(session.endTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                hint.innerText = `⏰ Valid Window: ${start} - ${end} | Eligible: ${session.allowedCategories || 'All Attendees'}`;
            } else {
                hint.innerText = '';
            }
        }

        // 4. Start Camera Stream
        function startCamera() {
            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 15, qrbox: { width: 250, height: 250 } };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                () => {} // Ignore passive empty frames
            ).catch(() => {
                html5QrCode.start({ facingMode: "user" }, config, onScanSuccess, () => {});
            });
        }

        // 5. Handle Scan & Submit to Java API
        async function onScanSuccess(decodedText) {
            if (isProcessing) return;
            isProcessing = true;

            const sessionId = document.getElementById('privilegeSelect').value;
            const counterName = document.getElementById('counterStation').value.trim();

            if (!sessionId) {
                alert("Please select a counter session first!");
                isProcessing = false;
                return;
            }

            try {
                const params = new URLSearchParams();
                params.append('conferenceCode', CONFERENCE_CODE);
                params.append('sessionId', sessionId);
                params.append('qrOrRegId', decodedText);
                params.append('counterName', counterName);
                params.append('operatorUsername', 'desk_volunteer');

                const res = await fetch('/api/privileges/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params
                });

                const data = await res.json();
                displayResult(data);
                playChime(data.success);

            } catch (err) {
                displayResult({
                    success: false,
                    message: "Server connection error. Check Wi-Fi.",
                    delegateName: "Network Error",
                    registrationId: "---"
                });
                playChime(false);
            }

            // Cool-down before next scan
            setTimeout(() => {
                isProcessing = false;
            }, 2500);
        }

        function displayResult(data) {
            const card = document.getElementById('resultCard');
            const icon = document.getElementById('resultIcon');
            const title = document.getElementById('resultTitle');
            const doc = document.getElementById('resultDoctor');
            const details = document.getElementById('resultDetails');
            const msg = document.getElementById('resultMessage');

            if (data.success) {
                card.className = "result-card result-success shadow";
                icon.innerHTML = `<i class="bi bi-check-circle-fill text-success"></i>`;
                title.innerText = "ACCESS APPROVED";
                doc.innerText = data.delegateName || "Attendee";
                details.innerText = `Reg ID: ${data.registrationId} | Category: ${data.category}`;
                msg.className = "fw-bold small py-1 px-2 border border-success bg-white text-success";
                msg.innerText = `✓ ${data.message} (${data.timestamp})`;
            } else {
                card.className = "result-card result-error shadow";
                icon.innerHTML = `<i class="bi bi-x-circle-fill text-danger"></i>`;
                title.innerText = "ACCESS REJECTED";
                doc.innerText = data.delegateName || "Attendee";
                details.innerText = data.registrationId ? `Reg ID: ${data.registrationId} | ${data.category}` : 'Badge Not Found';
                msg.className = "fw-bold small py-1 px-2 border border-danger bg-white text-danger";
                msg.innerText = `✗ ${data.message}`;
            }
        }

        function resetScanState() {
            document.getElementById('resultCard').className = "result-card";
            document.getElementById('resultCard').style.display = "none";
            updateTimingHint();
            isProcessing = false;
        }

        function handleManualSubmit() {
            const val = document.getElementById('manualInput').value.trim();
            if (val) {
                onScanSuccess(val);
                document.getElementById('manualInput').value = '';
            }
        }
    </script>
</body>
</html>
