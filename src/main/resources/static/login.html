<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Login | Joy Events</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            max-width: 440px;
            width: 100%;
            padding: 2.5rem;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            margin: 0 auto 1.5rem auto;
        }

        .form-control {
            border-radius: 10px;
            padding: 0.75rem 1rem;
            border: 1px solid #cbd5e1;
        }

        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .btn-login {
            background-color: #2563eb;
            color: white;
            font-weight: 600;
            border-radius: 10px;
            padding: 0.8rem;
            border: none;
            transition: all 0.2s;
        }

        .btn-login:hover {
            background-color: #1d4ed8;
            color: white;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-icon">
            <i class="bi bi-shield-lock-fill"></i>
        </div>

        <div class="text-center mb-4">
            <h4 class="fw-bold mb-1" style="color: #0f172a;">Sign In as Manager</h4>
            <p class="text-muted small">Enter your email and password to access the Joy Events operations portal.</p>
        </div>

        <div id="alertBox" class="alert alert-danger d-none py-2 small" role="alert"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary">Email address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                    <input type="email" id="loginEmail" class="form-control border-start-0 ps-0" 
                           placeholder="phocon2026@admin.com" value="phocon2026@admin.com" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold small text-secondary">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                    <input type="password" id="loginPassword" class="form-control border-start-0 ps-0" 
                           placeholder="••••••••" value="password123" required>
                </div>
            </div>

            <button type="submit" class="btn btn-login w-100 mb-3" id="loginBtn">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
            </button>
        </form>

        <div class="text-center mt-3 pt-3 border-top">
            <small class="text-muted">
                Need counter scanning? <a href="/scanner.html" class="text-decoration-none fw-semibold">Open Mobile Scanner</a>
            </small>
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const alertBox = document.getElementById('alertBox');
            
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Verifying...`;
            btn.disabled = true;
            alertBox.classList.add('d-none');

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const params = new URLSearchParams({ username: email, password: password });
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    sessionStorage.setItem('joyevents_user', JSON.stringify(data));
                    window.location.href = '/';
                } else {
                    alertBox.innerText = data.message || "Invalid email or password!";
                    alertBox.classList.remove('d-none');
                }
            } catch (err) {
                alertBox.innerText = "Could not connect to authentication server.";
                alertBox.classList.remove('d-none');
            } finally {
                btn.innerHTML = `<i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard`;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
